plugins { id 'com.android.application' }

android {
    namespace 'com.brwa.ultrasonic'
    compileSdk 35

    defaultConfig {
        applicationId 'com.brwa.ultrasonic'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Serves assets over https://appassets.androidplatform.net so the page is a
    // "secure context" and the microphone (getUserMedia) is allowed.
    implementation 'androidx.webkit:webkit:1.12.1'
}
